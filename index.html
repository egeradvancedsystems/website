<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Eger Advanced Systems</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;

            font-family: Arial, Helvetica, sans-serif;

            background: #f5f7fa;
            color: #1f2937;
        }

        .container {
            width: 100%;
            max-width: 700px;
            padding: 40px;
            text-align: center;
        }

        .logo {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: #111827;
            margin-bottom: 50px;
        }

        .logo span {
            color: #2563eb;
        }

        .icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 30px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: #e8f0fe;
            color: #2563eb;

            font-size: 36px;
        }

        h1 {
            font-size: 38px;
            margin-bottom: 18px;
            color: #111827;
        }

        p {
            font-size: 18px;
            line-height: 1.7;
            color: #6b7280;
            margin-bottom: 10px;
        }

        .status {
            display: inline-block;
            margin-top: 25px;
            padding: 10px 20px;

            border-radius: 30px;

            background: #e8f0fe;
            color: #2563eb;

            font-size: 14px;
            font-weight: 600;
        }

        footer {
            margin-top: 70px;
            font-size: 13px;
            color: #9ca3af;
        }

        @media (max-width: 600px) {
            .container {
                padding: 30px 20px;
            }

            h1 {
                font-size: 30px;
            }

            p {
                font-size: 16px;
            }

            .logo {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <div class="logo">
            Eger <span>Advanced Systems</span>
        </div>

        <div class="icon">
            ⚙
        </div>

        <h1>Estamos construindo algo novo.</h1>

        <p>
            Nosso novo site está em construção.
        </p>

        <p>
            Em breve, você poderá conhecer nossas soluções
            em tecnologia, automação e sistemas inteligentes.
        </p>

        <div class="status">
            EM CONSTRUÇÃO
        </div>

        <footer>
            © 2026 Eger Advanced Systems. Todos os direitos reservados.
        </footer>

    </main>

</body>
</html>
